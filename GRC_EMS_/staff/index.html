<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GRC Portal</title>
    <link rel="stylesheet" href="../assets/css/app.css" />
    <link rel="stylesheet" href="../assets/css/grc-theme.css?v=20260904-2" />
    <link rel="stylesheet" href="../assets/css/logo.css?v=2" />
    <link rel="stylesheet" href="../assets/css/sidebar-icons.css?v=1" />
    <link rel="stylesheet" href="../assets/css/form-consistency.css?v=2" />
  </head>
  <body data-portal-role="staff" data-module="dashboard">
    <aside class="sidebar" id="portalSidebar"></aside>
    <div class="app">
      <header class="top">
        <div>
          <small>Global Reciprocal Colleges</small><b id="pageTitle">Portal</b>
        </div>
        <div class="top-actions">
          <span>A.Y. 2026–2027</span>
          <form class="logout"><button type="submit">Sign out</button></form>
        </div>
      </header>
      <main class="dashboard">
        <div id="portalContent">
          <div class="status-card">Loading your workspace…</div>
        </div>
      </main>
    </div>
    <dialog id="actionDialog">
      <form method="dialog">
        <button class="dialog-close" aria-label="Close">×</button>
      </form>
      <h2 id="dialogTitle">Action</h2>
      <div id="dialogBody"></div>
    </dialog>
    <script src="../assets/js/portal-shell.js?v=7"></script>
    <script src="../assets/js/management.js?v=7"></script>
    <script src="../assets/js/portal.js?v=8"></script>
  </body>
</html>
