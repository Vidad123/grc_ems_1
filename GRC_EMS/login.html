<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portal Login | GRC</title>
    <link rel="stylesheet" href="assets/css/site.css" />
    <link rel="stylesheet" href="assets/css/grc-theme.css?v=20260904-2" />
    <link rel="stylesheet" href="assets/css/logo.css?v=1" />
    <link rel="stylesheet" href="assets/css/form-consistency.css?v=2" />
    <link rel="stylesheet" href="assets/css/backgrounds.css?v=1" />
  </head>
  <body class="login-page">
    <a class="back-home" href="index.html">← Back to school homepage</a>
    <main class="login-card">
      <img
        class="grc-login-logo"
        src="assets/logo_grc.png"
        alt="Global Reciprocal Colleges"
      />
      <span class="kicker">Secure portal</span>
      <h1>Welcome back</h1>
      <p>Sign in to continue to your assigned workspace.</p>
      <form id="portalLogin">
        <label
          >Email address<input
            type="email"
            name="email"
            required
            autocomplete="email"
        /></label>
        <label
          >Password<input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        /></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginMessage" role="alert"></div>
    </main>
    <script src="assets/js/login.js?v=2"></script>
  </body>
</html>
